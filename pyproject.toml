[project]
name = "pacman"
version = "0.0.1"
description = "Ghosts! More ghosts!"
requires-python = ">=3.10"
dependencies = [
    "mazegenerator",
    "mlx",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = "src"

[tool.uv.sources]
mazegenerator = { path = "wheels/mazegenerator-2.1.0-py3-none-any.whl" }
mlx = { path = "wheels/mlx-2.2-py3-none-any.whl" }
